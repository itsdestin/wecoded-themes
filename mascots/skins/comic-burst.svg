<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -5 30 30">
  <!--
    Skin: comic burst — comic pop turned to maximum. Manga speed-line burst behind the
    body (inside rig-root so it moves with the buddy), CMYK misregistration ghost
    outlines, fat 0.9 ink line, bigger halftone dots, double action sparks.
    Recolor for your theme:
      body     #f0a828     shade  #b8760f     ink  #604310 (light ink on dark bodies)
      face     #2a1004     sparkles #ffc030 / #ffe090 / #ffd060
      ghost plates stay #00b8ff (cyan) and #e8234a (red) on every theme.
    Contract: ../README.md
  -->
  <defs>
    <clipPath id="c-body"><path d="M9 4 L15 4 A4 4 0 0 1 19 8 L19 12 A4 4 0 0 1 15 16 L9 16 A4 4 0 0 1 5 12 L5 8 A4 4 0 0 1 9 4 Z"/></clipPath>
    <pattern id="p-dots2" width="1.7" height="1.7" patternUnits="userSpaceOnUse">
      <circle cx="0.85" cy="0.85" r="0.42" fill="#b8760f"/>
    </pattern>
  </defs>
  <g id="rig-root">
    <!-- speed-line burst: 22 radial lines on an ellipse around the body -->
    <g opacity="0.85" stroke="#604310">
      <line x1="20.60" y1="10.00" x2="24.20" y2="10.00" stroke-width="0.22"/>
      <line x1="20.31" y1="12.33" x2="23.79" y2="13.52" stroke-width="0.32"/>
      <line x1="19.11" y1="14.68" x2="22.09" y2="16.42" stroke-width="0.22"/>
      <line x1="16.63" y1="15.79" x2="18.79" y2="18.51" stroke-width="0.32"/>
      <line x1="13.55" y1="16.72" x2="14.31" y2="20.09" stroke-width="0.22"/>
      <line x1="10.77" y1="16.15" x2="10.03" y2="19.42" stroke-width="0.32"/>
      <line x1="7.61" y1="15.85" x2="5.72" y2="18.36" stroke-width="0.22"/>
      <line x1="5.29" y1="14.11" x2="2.62" y2="15.72" stroke-width="0.32"/>
      <line x1="3.62" y1="12.03" x2="0.31" y2="12.71" stroke-width="0.22"/>
      <line x1="3.30" y1="9.74" x2="-0.66" y2="9.65" stroke-width="0.32"/>
      <line x1="3.72" y1="7.49" x2="0.42" y2="6.42" stroke-width="0.22"/>
      <line x1="5.16" y1="5.36" x2="2.44" y2="3.55" stroke-width="0.32"/>
      <line x1="7.27" y1="3.94" x2="5.24" y2="1.28" stroke-width="0.22"/>
      <line x1="10.31" y1="3.02" x2="9.44" y2="-0.24" stroke-width="0.32"/>
      <line x1="13.19" y1="3.15" x2="13.86" y2="-0.13" stroke-width="0.22"/>
