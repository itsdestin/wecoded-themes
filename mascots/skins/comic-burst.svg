<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -5 30 30">
  <!--
    Skin: comic burst — comic pop turned to maximum. Manga speed-line burst behind the
    body (inside rig-root so it moves with the buddy), CMYK misregistration ghost
    outlines, fat 0.9 ink line, bigger halftone dots, double action sparks.
    Recolor for your theme:
      body     #f0a828     shade  #b8760f     ink  #604310 (light ink on dark bodies)
      face     #2a1004     sparkles #ffc030 / #ffe090 / #ffd060
      ghost plates stay #00b8ff (cyan) and #e8234a (red) on every theme.
    Contract: mascots/README.md (from the repo root)
  -->
