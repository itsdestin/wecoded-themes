        <ellipse cx="14.7" cy="9.25" rx="1.7" ry="2.3" fill="#2a1004"/>
        <g class="pupil"><circle cx="9.75" cy="9.2" r="0.42" fill="#ffc030"/><circle cx="9" cy="10.3" r="0.22" fill="#ffe090"/><circle cx="9.95" cy="10.15" r="0.14" fill="#ffd060"/></g>
        <g class="pupil"><circle cx="15.15" cy="8.9" r="0.42" fill="#ffc030"/><circle cx="14.4" cy="10" r="0.22" fill="#ffe090"/><circle cx="15.35" cy="9.85" r="0.14" fill="#ffd060"/></g>
        <path d="M13.5 6.1 Q14.7 5.55 15.9 6.1" fill="none" stroke="#2a1004" stroke-width="0.45" stroke-linecap="round"/>
        <ellipse cx="12.1" cy="13.1" rx="0.55" ry="0.65" fill="#2a1004"/>
      </g>
      <g id="rig-face-shocked" style="display:none">
        <circle cx="9.3" cy="9.8" r="2.1" fill="#2a1004"/>
        <circle cx="14.7" cy="9.8" r="2.1" fill="#2a1004"/>
        <circle cx="9.9" cy="9.2" r="0.5" fill="#ffe090"/><circle cx="15.3" cy="9.2" r="0.5" fill="#ffe090"/>
        <ellipse cx="12" cy="13.6" rx="1" ry="1.25" fill="#2a1004"/>
      </g>
      <g id="rig-face-dizzy" style="display:none">
        <g stroke="#2a1004" stroke-width="1" stroke-linecap="round">
          <line x1="8" y1="8.6" x2="10.6" y2="11.4"/><line x1="10.6" y1="8.6" x2="8" y2="11.4"/>
          <line x1="13.4" y1="8.6" x2="16" y2="11.4"/><line x1="16" y1="8.6" x2="13.4" y2="11.4"/>
